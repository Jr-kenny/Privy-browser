<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Privy Privacy Center</title>
  <link rel="stylesheet" href="chrome://resources/css/text_defaults.css">
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Google Sans", "Noto Sans", sans-serif;
      background: #f8fafd;
      color: #202124;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #202124;
        color: #e8eaed;
      }
    }

    body {
      margin: 0 auto;
      max-width: 980px;
      padding: 40px 32px 64px;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 16px;
    }

    .subtitle, .muted { color: #5f6368; }

    @media (prefers-color-scheme: dark) {
      .subtitle, .muted { color: #bdc1c6; }
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin: 28px 0;
    }

    .card, .activity {
      background: rgba(255, 255, 255, .88);
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 20px;
    }

    @media (prefers-color-scheme: dark) {
      .card, .activity {
        background: #292a2d;
        border-color: #5f6368;
      }
    }

    .value {
      font-size: 26px;
      font-weight: 500;
      margin-top: 8px;
    }

    .status {
      align-items: center;
      display: flex;
      gap: 8px;
    }

    .status::before {
      background: #188038;
      border-radius: 50%;
      content: "";
      display: inline-block;
      height: 10px;
      width: 10px;
    }

    button {
      background: #1a73e8;
      border: 0;
      border-radius: 18px;
      color: white;
      cursor: pointer;
      font: inherit;
      padding: 9px 18px;
    }

    button.secondary {
      background: transparent;
      border: 1px solid #5f6368;
      color: inherit;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 24px 0 32px;
    }

    #frequency-result {
      min-height: 20px;
      margin: 8px 0 0;
    }

    .activity-list {
      display: grid;
      gap: 10px;
    }

    .activity {
      display: grid;
      gap: 4px;
      grid-template-columns: minmax(120px, 1fr) minmax(120px, 2fr);
    }

    .activity strong { font-weight: 500; }
    .empty { padding: 24px 0; }
  </style>
</head>
<body>
  <h1>Privacy Center</h1>
  <p class="subtitle">Privy Browser keeps sensitive behavioral inputs inside this profile and records only bounded activity metadata.</p>

  <div class="grid">
    <section class="card">
      <div class="muted">Protection</div>
      <div class="value status" id="protection-status">Loading</div>
    </section>
    <section class="card">
      <div class="muted">Private compute</div>
      <div class="value" id="provider-status">Loading</div>
    </section>
    <section class="card">
      <div class="muted">Requests recorded</div>
      <div class="value" id="request-count">0</div>
    </section>
  </div>

  <section class="card">
    <h2>Activity counts</h2>
    <div class="grid" id="counts"></div>
  </section>

  <div class="actions">
    <button id="run-frequency">Run browser frequency-cap check</button>
    <button class="secondary" id="clear-activity">Clear activity</button>
    <p id="frequency-result" class="muted" aria-live="polite"></p>
  </div>

  <section>
    <h2>Recent privacy activity</h2>
    <div class="activity-list" id="activity-list"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
